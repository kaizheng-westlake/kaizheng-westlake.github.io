short_bio: >-
  <p>
    I am a second-year undergraduate student majoring in Artificial Intelligence
    at Westlake University, where I am currently working in Huang Lab.
  </p>
  <p>
    My research interests lie in virtual humans, multimodal large language models
    (MLLMs), and speech-driven facial animation. I previously participated in
    projects related to garment and texture generation for 3D data processing.
  </p>
  <p>
    My recent work focuses on leveraging multimodal large language models for
    facial animation and virtual human generation. I am currently preparing the
    submission of my first-author work, <em>AudioFace</em>, which has been
    released as an arXiv preprint.
  </p>

